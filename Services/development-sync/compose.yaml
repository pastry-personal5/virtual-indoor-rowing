services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: rowing_development
      POSTGRES_USER: rowing_development
      POSTGRES_PASSWORD: ${VIR_POSTGRES_PASSWORD:?run make development-sync-bootstrap first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - development_sync_postgres:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rowing_development -d rowing_development"]
      interval: 2s
      timeout: 2s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: development
      MINIO_ROOT_PASSWORD: ${VIR_MINIO_PASSWORD:?run make development-sync-bootstrap first}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - development_sync_minio:/data
  api:
    build: .
    environment:
      VIR_BOOTSTRAP_SECRET: ${VIR_BOOTSTRAP_SECRET:?run make development-sync-bootstrap first}
      VIR_POSTGRES_DSN: postgres://rowing_development:${VIR_POSTGRES_PASSWORD}@postgres:5432/rowing_development?sslmode=disable
      VIR_MINIO_INTERNAL_ENDPOINT: minio:9000
      VIR_MINIO_PUBLIC_ENDPOINT: 127.0.0.1:59000
      VIR_MINIO_ACCESS_KEY: development
      VIR_MINIO_SECRET_KEY: ${VIR_MINIO_PASSWORD:?run make development-sync-bootstrap first}
      VIR_MINIO_BUCKET: development-session-objects
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
  worker:
    build: .
    command: ["/worker"]
    environment:
      VIR_POSTGRES_DSN: postgres://rowing_development:${VIR_POSTGRES_PASSWORD}@postgres:5432/rowing_development?sslmode=disable
      VIR_MINIO_INTERNAL_ENDPOINT: minio:9000
      VIR_MINIO_ACCESS_KEY: development
      VIR_MINIO_SECRET_KEY: ${VIR_MINIO_PASSWORD:?run make development-sync-bootstrap first}
      VIR_MINIO_BUCKET: development-session-objects
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}

volumes:
  development_sync_postgres:
  development_sync_minio:
