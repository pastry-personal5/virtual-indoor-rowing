name: Unreal Shipping verifier

on:
  push:
    branches: [main]
    # A documentation-only push cannot change the package; skip the hour-long build.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Builds are expensive: a running one finishes, and only the newest waiting one is kept.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  unsigned-shipping:
    runs-on: [self-hosted, macOS, ARM64, vir-m1]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
      - name: Verify pinned host
        run: make doctor
      - name: Build unsigned Shipping package
        run: make unreal-shipping
      - name: Verify staged package
        run: |
          set -o pipefail
          make unreal-package-verify | tee Build/unreal-shipping/package-verification.txt
      - name: Retain redacted package evidence
        uses: actions/upload-artifact@v4
        with:
          name: unreal-shipping-provenance-${{ github.sha }}
          if-no-files-found: error
          path: |
            Build/unreal-shipping/provenance.json
            Build/unreal-shipping/package-verification.txt
